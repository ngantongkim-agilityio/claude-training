name: Feature request
description: A new capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What changes for whom, and why, in two or three sentences. Link the spec and name dependencies when there are any.
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Business rules
      description: Agreed rules and constraints, one per line, with their source. No implementation detail.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: At most 8 testable criteria, one line each.
      placeholder: |
        - AC-1 Given <state>, when <action>, then <result>.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test cases
      description: At most 5 key cases; the full matrix stays in the spec.
      placeholder: |
        | TC | AC | Given | When | Then |
        |---|---|---|---|---|
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue will not do.
    validations:
      required: false
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Blocking questions first, each with who answers it.
    validations:
      required: false

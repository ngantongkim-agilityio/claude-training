name: Feature request
description: A new capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Problem / outcome
      description: What changes for whom, and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable criteria, one per line.
      placeholder: |
        - AC-1 Given <state>, when <action>, then <result>.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - tax-invoice-api
        - web
        - tooling / docs
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue will not do.
    validations:
      required: false

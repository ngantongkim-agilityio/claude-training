name: Bug report
description: Something behaves wrongly or breaks.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences — what is wrong, where, and for whom.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, with sample (non-secret) inputs.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead. Paste the error or response body; never secrets.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - tax-invoice-api
        - web
        - tooling / docs
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit, branch, Node/pnpm version, or anything else relevant.
    validations:
      required: false

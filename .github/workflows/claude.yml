name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # Collaborators only, humans only, no fork PRs on PR review events.
    # issue_comment payloads also carry the issue, so only `issues` may read the issue's fields.
    if: >-
      github.event.sender.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event_name == 'issues' && github.event.issue.author_association
        || github.event.comment.author_association
        || github.event.review.author_association)
      && (contains(github.event.comment.body, '@claude')
        || contains(github.event.review.body, '@claude')
        || (github.event_name == 'issues'
          && (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude'))))
      && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
    # PR review events run the PR's workflow copy, so the secret waits for approval there.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'claude-review' || 'claude-review-pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read # Required for Claude to read CI results on PRs
      id-token: write # Required to exchange OIDC for the claude[bot] token
    env:
      DENIED_TOOLS: "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git reset:*),Bash(git merge:*),Bash(git rebase:*),Bash(git tag:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh api:*),Bash(*git-push.sh*),Read(./.git/**),Read(//proc/**)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: List denied tools
        run: |
          echo "Denied tools:"
          echo "$DENIED_TOOLS" | tr ',' '\n'

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Answer-only: no edits, commits or branches.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)" --disallowedTools "${{ env.DENIED_TOOLS }}"'

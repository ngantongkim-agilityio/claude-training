name: Claude Code

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # Collaborators only: ignore @claude from anyone else.
    if: contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    environment: claude-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      DENIED_TOOLS: "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git reset:*),Bash(git merge:*),Bash(git rebase:*),Bash(git tag:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh api:*)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: List denied tools
        run: |
          echo "Denied tools:"
          echo "$DENIED_TOOLS" | tr ',' '\n'

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

          # Allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Answer-only: no edits, commits or branches.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)" --disallowedTools "${{ env.DENIED_TOOLS }}"'

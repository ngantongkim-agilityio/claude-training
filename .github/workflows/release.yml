name: Release

# A pushed version tag drafts the GitHub release from docs/releases/<tag>.md.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the draft release
    steps:
      - name: Check the tag is an exact version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "$TAG is not vX.Y.Z" >&2; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the next step checks the tag is on main
          persist-credentials: false

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$TAG^{commit}" origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] && src=(--notes-file "$notes") || src=(--generate-notes)
          gh release create "$TAG" --draft --verify-tag --title "$TAG" "${src[@]}"
